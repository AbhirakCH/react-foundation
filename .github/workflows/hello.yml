name: React CI Pipeline

on: [push]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: npm install -g pnpm && pnpm install

      - name: Run Unit Tests
        run: npx vitest run

      - name: Build Project
        run: pnpm run build
