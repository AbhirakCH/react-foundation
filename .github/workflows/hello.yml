name: React CI/CD Pipeline

on:
  push:
    branches: ["main", "develop"] # Run when push to main or develop branch
  workflow_dispatch: # Allow to run manually

# Allow GITHUB_TOKEN to read/write (required for deployment)
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Job 1: Build & Test
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: npm install -g pnpm && pnpm install

      - name: Run Unit Tests
        run: npx vitest run

      - name: Build Project
        run: pnpm run build

      # Upload artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  # Job 2: Deploy (will run after Job 1 passed)
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-test # Wait for build-test to finish
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
